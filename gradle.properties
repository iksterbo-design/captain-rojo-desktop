# ---- Efficiency build config (Alienware 16X: 24-core Ultra 9 275HX) ----
# Parallel builds (multi-project)
org.gradle.parallel=true
org.gradle.parallel.number.of.workers=24
# Daemon keeps the JVM warm
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m
# Ensure all workers are used (no serialization)
org.gradle.parallel.cores.max=24
